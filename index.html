<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Назва сайту</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>
<header class="main-header">
    <div class="logo-area">
        <img src="images/weather1-removebg-preview 1.png" alt="weather" class="logo-img">
        <h1>Weather</h1>
    </div>

    <div class="search-container">
        <img src="images/magnifier_find_search_ecommerce_icon_224939 1.png" alt="search" class="search-icon">
        <input type="text" placeholder="Location" class="search-input">
    </div>
</header>

<main class="container">
    <!-- Блок 1: Почасовой прогноз (верхний ряд) -->
    <section class="hourly-forecast">


        <div class="hourly-card">
            <p>12:00</p>
            <img src="images/weather1-removebg-preview 1.png" alt="weather">
            <p class="hourly-temp">24°C</p>
        </div>


        <div class="hourly-card">
            <p>12:00</p>
            <img src="images/weather1-removebg-preview 1.png" alt="weather">
            <p class="hourly-temp">24°C</p>
        </div>


        <div class="hourly-card">
            <p>12:00</p>
            <img src="images/weather1-removebg-preview 1.png" alt="weather">
            <p class="hourly-temp">24°C</p>
        </div>


        <div class="hourly-card">
            <p>12:00</p>
            <img src="images/weather1-removebg-preview 1.png" alt="weather">
            <p class="hourly-temp">24°C</p>
        </div>


        <div class="hourly-card">
            <p>12:00</p>
            <img src="images/weather1-removebg-preview 1.png" alt="weather">
            <p class="hourly-temp">24°C</p>
        </div> <!-- Таких будет 5 штук -->


    </section>

<div class="bottom-container">
    <!-- Левая колонка: Прогноз на 5 дней -->
    <div class="five-days-section">
        <h2 class="section-title">5 days</h2>
        <div class="days-list">
            <!-- Пример одной строки дня -->
            <div class="day-item">
                <span class="day-name">Monday</span>
                <img src="images/weather1-removebg-preview 1.png" alt="weather" class="small-icon">
                <span class="day-temp">24°C</span>
            </div>
            <!-- Скопируй этот day-item еще 4 раза для теста -->
        </div>
    </div>

    <!-- Правая часть: Огромная карточка текущей погоды -->
    <div class="current-weather-main">
        <div class="main-temp-display">
            <span class="big-temp">24°C</span>
            <p class="current-date">Saturday, 9 May</p>
        </div>
        <img src="images/weather1-removebg-preview 1.png" alt="big-sun" class="huge-icon">
    </div>
</div>


</main>





 </body>
</html>
