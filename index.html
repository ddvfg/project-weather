<!DOCTYPE html>
<html lang="uk">
<head>

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-S0GXBP6MD3');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
<header class="main-header">
    <div class="logo-area">
        <img src="images/weather1-removebg-preview 1.png" alt="weather" class="logo-img">
        <h1 class="logo-text">Weather</h1>
    </div>

    <div class="search-container">
        <img src="images/magnifier_find_search_ecommerce_icon_224939 1.png" alt="search" class="search-icon">
        <input type="text" id="city-input" placeholder="Location" class="search-input">
    </div>
</header>

<main class="container">
    <section class="hourly-forecast">
        <!-- Почасовые карточки -->
        <div class="hourly-card"><p>12:00</p><img src="images/clear 1.png" alt="weather"><p class="hourly-temp">24°C</p></div>
        <div class="hourly-card"><p>15:00</p><img src="images/clouds 1.png" alt="weather"><p class="hourly-temp">24°C</p></div>
        <div class="hourly-card"><p>18:00</p><img src="images/clouds 2.png" alt="weather"><p class="hourly-temp">24°C</p></div>
        <div class="hourly-card"><p>21:00</p><img src="images/clear 2.png" alt="weather"><p class="hourly-temp">24°C</p></div>
        <div class="hourly-card"><p>00:00</p><img src="images/mist 1.png" alt="weather"><p class="hourly-temp">24°C</p></div>
    </section>

    <div class="bottom-container">
        <!-- Прогноз на 5 дней -->
        <div class="card daily-card">
            <h3 class="card-title">5 days</h3>
            <div class="daily-list">
                <div class="day-row"><img src="images/clear 1.png" alt="w"><span class="day-temp">20°C</span><span class="day-date">Friday, 1 Sep</span></div>
                <div class="day-row"><img src="images/rain 1.png" alt="w"><span class="day-temp">22°C</span><span class="day-date">Saturday, 2 Sep</span></div>
                <div class="day-row"><img src="images/clouds 1.png" alt="w"><span class="day-temp">27°C</span><span class="day-date">Sunday, 3 Sep</span></div>
                <div class="day-row"><img src="images/clear 3.png" alt="w"><span class="day-temp">18°C</span><span class="day-date">Monday, 4 Sep</span></div>
                <div class="day-row"><img src="images/mist 1.png" alt="w"><span class="day-temp">16°C</span><span class="day-date">Tuesday, 5 Sep</span></div>
            </div>
        </div>

        <!-- Главная карточка -->
        <div class="card main-weather-card">
            <div class="main-info">
                <div class="temp-block">
                    <span class="huge-temp">24°C</span>
                    <p class="feels-like">Feels like: 22°C</p>
                </div>
                <div class="sun-block">
                    <img src="images/clear 1.png" alt="sun" class="main-sun">
                    <h2 class="weather-status">Sunny</h2>
                </div>
                <div class="wind-block">
                    <img src="images/wind 1.png" alt="wind">
                    <span class="wind-speed">2km/h</span>
                    <p>Wind Speed</p>
                </div>
            </div>
            
            <div class="sun-times">
                <div class="sun-item">
                    <img src="images/sunrise-white 1.png" alt="sunrise">
                    <div><p>Sunrise</p><span>06:37 AM</span></div>
                </div>
                <div class="sun-item">
                    <img src="images/sunset-white 1.png" alt="sunset">
                    <div><p>Sunset</p><span>20:37 PM</span></div>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="script.js"></script>
</body>
</html>
